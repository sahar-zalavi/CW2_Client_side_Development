<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unity Bank</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="stylesheet.css">

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<header>
  <div class="logo-text">Unity Bank</div>

  <div class="nav-links">
    <a href="#">Home</a>
    <a href="#">Accounts</a>
    <a href="#">Transfers</a>
  </div>

  <div class="auth-buttons">
    <button id="signInBtn">Sign In</button>
    <button id="signUpBtn">Sign Up</button>
    <button id="signOutBtn" style="display:none;">Sign Out</button>
  </div>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Welcome to Unity Bank</h1>
    <p>Manage your accounts and transfers securely.</p>
  </div>
</section>

<section class="container">

  <h2 class="section-title">Your Accounts</h2>

  <div class="action-bar">

    <button class="account-btn open-account" data-type="Current Account">Current Account</button>
    <button class="account-btn open-account" data-type="Savings Account">Savings Account</button>
    <button class="account-btn open-account" data-type="Student Account">Student Account</button>
    <button class="account-btn open-account" data-type="Business Account">Business Account</button>

    <!-- FIXED BUTTON -->
    <button class="account-btn transfer-button">Transfer Money</button>

  </div>

  <div class="total-box">
    <h3>Total Balance</h3>
    <h2 id="totalBalance">£0.00</h2>
  </div>

  <div id="accountList" class="accounts-grid"></div>

</section>

<section class="container">
  <h2 class="section-title">Transaction History</h2>
  <div id="transactionList"></div>
</section>

<!-- ACCOUNT MODAL -->
<div class="modal fade" id="accountModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Create Account</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form id="accountForm">
          <input type="hidden" id="accountType">

          <label>Initial Deposit</label>
          <input name="deposit" type="number" class="form-control mb-2">

          <button class="btn-primary">Create Account</button>
        </form>

      </div>

    </div>
  </div>
</div>

<!-- TRANSFER MODAL -->
<div class="modal fade" id="transferModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5>Transfer Money</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <form id="transferForm">

          <label>From</label>
          <select id="fromAccount" class="form-control mb-2"></select>

          <label>To</label>
          <select id="toAccount" class="form-control mb-2"></select>

          <input id="transferAmount" class="form-control mb-2" placeholder="Amount">

          <button class="btn-primary">Send Money</button>

        </form>

      </div>
    </div>
  </div>
</div>

<script src="JavaScript.js"></script>

</body>
</html>

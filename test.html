<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Test</title>
  <script src="jquery-4.0.0.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    header {
      background: #0A2A66;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      position: relative;
      z-index: 1000;
      overflow: visible;
    }

    .logo-text {
      color: white;
      font-size: 20px;
      font-weight: bold;
      margin-right: 20px;
    }

    .nav-toggle {
      display: none;
      margin-left: auto;
      background: none;
      border: 1px solid white;
      color: white;
      font-size: 20px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 4px;
    }

    .nav1 {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .nav1 a {
      color: white;
      text-decoration: none;
      font-weight: 500;
    }

    /* DROPDOWN DESKTOP */
    .dropdown {
      position: relative;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: white;
      padding: 16px;
      width: 260px;
      border-radius: 8px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
      z-index: 10000;
      border: 1px solid #ddd;
    }

    .dropdown-content input {
      display: block;
      width: 100%;
      margin-bottom: 10px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      color: #333;
      font-size: 14px;
    }

    .dropdown-content button {
      width: 100%;
      background: #0A2A66;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    /* MOBILE */
    @media (max-width: 768px) {
      .nav-toggle {
        display: block;
      }

      .nav1 {
        display: none;
        flex-direction: column;
        align-items: flex-start;
        width: 100%;
        padding: 12px 0;
        gap: 14px;
      }

      .nav1.open {
        display: flex;
      }

      /* KEY FIX: dropdown becomes inline on mobile */
      .dropdown {
        position: static;
        width: 100%;
      }

      .dropdown-content {
        position: static;
        width: 100%;
        box-shadow: none;
        border: 1px solid #ddd;
        border-radius: 8px;
        margin-top: 8px;
        padding: 16px;
        background: white;
      }
    }

    body { font-family: Arial, sans-serif; }
    p { padding: 20px; }
  </style>
</head>
<body>

<header>
  <span class="logo-text">Unity Bank</span>

  <button class="nav-toggle" id="navToggle">&#9776;</button>

  <nav class="nav1" id="mainNav">
    <a href="#">Home</a>
    <a href="#">Accounts</a>

    <div class="dropdown">
      <a href="#" id="signInBtn">Sign in</a>
      <div class="dropdown-content" id="signInBox">
        <form id="signInForm">
          <input type="text" placeholder="Username">
          <input type="password" placeholder="Password">
          <button type="submit">Sign in</button>
        </form>
      </div>
    </div>

    <div class="dropdown">
      <a href="#" id="signUpBtn">Sign up</a>
      <div class="dropdown-content" id="signUpBox">
        <form id="signUpForm">
          <input type="text" placeholder="Username">
          <input type="email" placeholder="Email">
          <input type="password" placeholder="Password">
          <button type="submit">Sign up</button>
        </form>
      </div>
    </div>

  </nav>
</header>

<p>Open this on mobile and test Sign in / Sign up buttons.</p>

<script>
$(document).ready(function () {

  // Hamburger
  $("#navToggle").on("click", function () {
    $("#mainNav").toggleClass("open");
  });

  // Sign in / Sign up toggle
  $("#signInBtn, #signUpBtn").on("click", function (e) {
    e.preventDefault();
    e.stopPropagation();

    const isSignIn = this.id === "signInBtn";
    const target = isSignIn ? "#signInBox" : "#signUpBox";
    const other  = isSignIn ? "#signUpBox" : "#signInBox";

    $(other).hide();
    $(target).stop().toggle();
  });

  // Close dropdowns when clicking outside
  $(document).on("click", function (e) {
    if (!$(e.target).closest(".dropdown").length) {
      $(".dropdown-content").hide();
    }
  });

  // Prevent clicks inside dropdown-content from closing it
  $(".dropdown-content").on("click", function (e) {
    e.stopPropagation();
  });

});
</script>

</body>
</html>
